name: Android CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name gym_system_management_lite .
      - name: Get dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-lite-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  license-manager-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: license_manager
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org ar.com.gymlite --project-name gym_lite_license_manager .
      - name: Dependencies
        run: flutter pub get
      - name: Analyze manager
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build manager debug APK
        run: flutter build apk --debug
      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: gym-lite-license-manager-debug-apk
          path: license_manager/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
