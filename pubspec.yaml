name: gym_system_management_lite
description: Gestión offline de clientes, cuotas y cobros para pequeños estudios.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  cryptography: ^2.9.0
  file_picker: ^10.3.3
  share_plus: ^11.0.0
  cross_file: ^0.3.4
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.4
  pdf: ^3.13.1
  whatsapp_share_plus: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.5
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/higea_splash.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/higea_icon.png"
  adaptive_icon_background: "#061D33"
  adaptive_icon_foreground: "assets/branding/higea_icon_foreground.png"
  adaptive_icon_foreground_inset: 18
